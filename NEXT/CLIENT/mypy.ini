# mypy checks pybak as Python 3. There are no stub files: every module is typed
# with type comments, and the tags are defined in pk_types.py (and portapy's
# own in portapy_sdk, from $PORTAPY/src on MYPYPATH).
#   MYPYPATH=$PORTAPY/src mypy
[mypy]
strict = True
# Modules shared with the server live in ../SHARED (pk_types.py, util.py, ...).
mypy_path = ../SHARED
# test_naming.py is left out on purpose: it feeds raw values into the strategies.
files = naming.py, client.py, client_util.py, smells.py, filename_util.py, http_client.py, metadata_constants.py, ../SHARED/pk_types.py, ../SHARED/util.py, ../SHARED/wanted_sync.py, ../SHARED/manifest.py

# Python 2's md5 module (the fallback when hashlib is missing). The import line
# must stay exactly 'import md5' for the portapy pragma, so it cannot carry a
# '# type: ignore' comment.
[mypy-md5]
ignore_missing_imports = True
