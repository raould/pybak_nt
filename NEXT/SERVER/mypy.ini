# mypy checks the server (Python 3 only, real annotations) together with the
# shared modules it imports from ../SHARED, against portapy's types:
#   MYPYPATH=$PORTAPY/src mypy
[mypy]
strict = True
mypy_path = ../SHARED
files = main.py, ../SHARED/pk_types.py, ../SHARED/util.py, ../SHARED/wanted_sync.py, ../SHARED/manifest.py

# Python 2's md5 module, the fallback in SHARED/util.py when hashlib is missing.
[mypy-md5]
ignore_missing_imports = True
